<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><defs><style>.t{font:15px Arial,sans-serif;fill:#263830}.muted{font:13px Arial,sans-serif;fill:#78857d}.bold{font:bold 17px Arial,sans-serif;fill:#263830}.title{font:bold 27px Arial,sans-serif;fill:#263830}.label{font:bold 12px Arial,sans-serif;fill:#718078}.white{font:bold 14px Arial,sans-serif;fill:white}</style></defs><rect width="1280" height="820" fill="#f5f7f3" /><rect width="235" height="820" fill="#fff" /><text x="28" y="40" class="label">МЕНЮ</text><text x="47" y="85" class="t">⌂  Сегодня</text><rect x="16" y="108" width="203" height="44" rx="12" fill="#eaf4ec" /><text x="47" y="136" class="t">▤  Привычки</text><text x="47" y="186" class="t">▦  Статистика</text><text x="47" y="236" class="t">♡  Поддержка</text><line x1="24" y1="275" x2="211" y2="275" stroke="#edf0ec" /><text x="47" y="316" class="t">⚙  Настройки</text><rect x="19" y="728" width="197" height="67" rx="14" fill="#f4f6f2" /><circle cx="49" cy="761" r="17" fill="#dce9df" /><text x="77" y="758" class="bold">Евгений</text><text x="77" y="778" class="muted">Мой профиль</text><text x="278" y="48" class="muted">Привычки  /  Новая привычка</text><text x="278" y="94" class="title">Добавим привычку</text><text x="278" y="122" class="muted">Начни с небольшого действия. Его всегда можно изменить позже.</text><rect x="278" y="153" width="760" height="93" rx="16" fill="#eaf4ec" /><circle cx="319" cy="199" r="24" fill="#fff" /><text x="309" y="207" font-size="23">✨</text><text x="359" y="190" class="bold">Подобрать готовый шаблон</text><text x="359" y="216" class="muted">Например: больше двигаться, читать или пить воду</text><text x="949" y="204" class="t">Выбрать →</text><text x="278" y="286" class="label">ИЛИ СОЗДАЙ СВОЮ</text><rect x="278" y="305" width="760" height="430" rx="18" fill="#fff" /><text x="310" y="346" class="bold">Название привычки</text><rect x="310" y="362" width="696" height="48" rx="10" fill="#fff" stroke="#dce3dd" /><text x="328" y="392" class="muted">Например, читать перед сном</text><text x="310" y="448" class="bold">Когда и что ты будешь делать?</text><rect x="310" y="465" width="696" height="48" rx="10" fill="#fff" stroke="#dce3dd" /><text x="328" y="495" class="muted">После [обычного действия] я сделаю [новое действие]</text><text x="310" y="550" class="bold">Выбери свой комфортный темп</text><text x="310" y="579" class="muted">Обычный шаг</text><rect x="310" y="591" width="331" height="45" rx="10" fill="#fff" stroke="#dce3dd" /><text x="328" y="620" class="t">Читать 10 страниц</text><text x="675" y="579" class="muted">Минимум на занятый день</text><rect x="675" y="591" width="331" height="45" rx="10" fill="#fff" stroke="#dce3dd" /><text x="693" y="620" class="t">Прочитать 1 страницу</text><text x="310" y="675" class="bold">В какие дни?</text><rect x="423" y="652" width="43" height="36" rx="10" fill="#43865c" /><text x="437" y="676" class="white">П</text><rect x="473" y="652" width="43" height="36" rx="10" fill="#43865c" /><text x="487" y="676" class="white">В</text><rect x="523" y="652" width="43" height="36" rx="10" fill="#43865c" /><text x="537" y="676" class="white">С</text><rect x="573" y="652" width="43" height="36" rx="10" fill="#43865c" /><text x="587" y="676" class="white">Ч</text><rect x="623" y="652" width="43" height="36" rx="10" fill="#43865c" /><text x="637" y="676" class="white">П</text><rect x="673" y="652" width="43" height="36" rx="10" fill="#f4f6f2" /><text x="687" y="676" class="label">С</text><rect x="723" y="652" width="43" height="36" rx="10" fill="#f4f6f2" /><text x="737" y="676" class="label">В</text><rect x="310" y="702" width="696" height="1" fill="#edf0ec" /><rect x="310" y="714" width="696" height="1" fill="#edf0ec" /><rect x="278" y="757" width="170" height="44" rx="12" fill="#43865c" /><text x="363" y="785" class="white" text-anchor="middle">Сохранить привычку</text><text x="481" y="784" class="muted">Можно изменить план в любой момент</text><rect x="1062" y="153" width="182" height="203" rx="18" fill="#fff" /><text x="1084" y="188" class="bold">Совет</text><text x="1084" y="222" class="muted">Выбери цель,</text><text x="1084" y="244" class="muted">которую реально</text><text x="1084" y="266" class="muted">выполнить даже</text><text x="1084" y="288" class="muted">в загруженный день.</text><text x="1084" y="327" class="label">Начать проще — лучше</text><rect x="1062" y="374" width="182" height="131" rx="18" fill="#fff" /><text x="1084" y="409" class="bold">Твой выбор</text><text x="1084" y="442" class="muted">Создавай сначала</text><text x="1084" y="464" class="muted">несколько привычек,</text><text x="1084" y="486" class="muted">а не десятки сразу.</text></svg>