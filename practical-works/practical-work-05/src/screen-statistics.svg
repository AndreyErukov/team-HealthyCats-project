<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><defs><style>.t{font:15px Arial,sans-serif;fill:#263830}.muted{font:13px Arial,sans-serif;fill:#78857d}.bold{font:bold 17px Arial,sans-serif;fill:#263830}.title{font:bold 28px Arial,sans-serif;fill:#263830}.label{font:bold 12px Arial,sans-serif;fill:#718078}</style></defs><rect width="1280" height="820" fill="#f5f7f3" /><rect width="235" height="820" fill="#fff" /><text x="28" y="40" class="label">МЕНЮ</text><text x="47" y="85" class="t">⌂  Сегодня</text><text x="47" y="136" class="t">▤  Привычки</text><rect x="16" y="158" width="203" height="44" rx="12" fill="#eaf4ec" /><text x="47" y="186" class="t">▦  Статистика</text><text x="47" y="236" class="t">♡  Поддержка</text><line x1="24" y1="275" x2="211" y2="275" stroke="#edf0ec" /><text x="47" y="316" class="t">⚙  Настройки</text><rect x="19" y="728" width="197" height="67" rx="14" fill="#f4f6f2" /><circle cx="49" cy="761" r="17" fill="#dce9df" /><text x="77" y="758" class="bold">Евгений</text><text x="77" y="778" class="muted">Мой профиль</text><text x="278" y="54" class="muted">ТВОЙ ПРОГРЕСС</text><text x="278" y="100" class="title">Ты движешься вперёд</text><text x="278" y="129" class="muted">Регулярность — это не идеальная серия, а возвращение к своим целям.</text><rect x="278" y="157" width="291" height="123" rx="17" fill="#fff" /><text x="302" y="191" class="label">ТЕКУЩАЯ СЕРИЯ</text><text x="302" y="235" class="title">🔥  4 дня</text><text x="302" y="259" class="muted">Самая длинная: 9 дней</text><rect x="585" y="157" width="291" height="123" rx="17" fill="#fff" /><text x="609" y="191" class="label">ВЫПОЛНЕНИЯ ЗА НЕДЕЛЮ</text><text x="609" y="235" class="title">18 из 23</text><text x="609" y="259" class="muted">Это устойчивый прогресс</text><rect x="892" y="157" width="352" height="123" rx="17" fill="#fff" /><text x="916" y="191" class="label">МИНИМУМЫ — ТОЖЕ ПРОГРЕСС</text><text x="916" y="235" class="title">5 раз</text><t