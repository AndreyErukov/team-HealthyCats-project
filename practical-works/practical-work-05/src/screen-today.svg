e">Отметить ✓</text><text x="278" y="307" class="bold">План на сегодня</text><text x="822" y="307" class="small">2 из 4 выполнено</text><rect x="278" y="327" width="620" height="126" rx="16" fill="#fff" /><text x="302" y="357" class="label">УТРО</text><circle cx="315" cy="393" r="10" fill="#43865c" /><path d="m310 393 4 4 7-8" stroke="#fff" stroke-width="2" fill="none" /><text x="339" y="398" class="t">Выпить стакан воды</text><text x="339" y="421" class="small">После пробуждения · 2 минуты</text><text x="818" y="400" class="small" fill="#43865c">Готово</text><line x1="302" y1="435" x2="874" y2="435" stroke="#edf0ec" /><rect x="278" y="467" width="620" height="126" rx="16" fill="#f0f7f0" stroke="#b8d4bd" stroke-width="2" /><rect x="297" y="478" width="91" height="26" rx="9" fill="#dceede" /><text x="309" y="497" class="label">ДЕНЬ</text><rect x="395" y="480" width="76" height="22" rx="8" fill="#43865c" /><text x="405" y="495" class="small" style="fill:#fff;font-weight:bold">СЕЙЧАС</text><circle cx="315" cy="535" r="10" fill="#fff" stroke="#b9c6bc" stroke-width="2" /><text x="339" y="540" class="t">Прогуляться 15 минут</text><text x="339" y="563" class="small">После обеда · 15 минут</text><rect x="685" y="517" width="104" height="36" rx="10" fill="#43865c" /><text x="701" y="540" class="white" font-size="12">Сделано</text><rect x="798" y="517" width="82" height="36" rx="10" fill="#f2f6f1" /><text x="808" y="540" class="label" font-size="11">Минимум</text><rect x="278" y="607" width="620" height="126" rx="16" fill="#fff" /><text x="302" y="637" class="label">ВЕЧЕР</text><circle cx="315" cy="675" r="10" fill="#fff" stroke="#b9c6bc" stroke-width="2" /><text x="339" y="680" class="t">Подготовить вещи на завтра</text><text x="339" y="703" class="small">Перед сном · 5 минут</text><text x="817" y="681" class="small">•••</text><rect x="925" y="148" width="319" height="196" rx="18" fill="#fff" /><text x="950" y="183" class="bold">Совет дня</text><text x="950" y="222" class="t">Начните с малого</text><text x="950" y="249" class="muted">Небольшие действия легче</text><text x="950" y="270" class="muted">повторять регулярно. Упростить</text><text x="950" y="291" class="muted">шаг — это тоже прогресс.</text><rect x="925" y="361" width="319" height="196" rx="18" fill="#fff" /><text x="950" y="396" class="bold">Нужна пауза?</text><text x="950" y="429" class="muted">Планы меняются — это нормально.</text><text x="950" y="451" class="muted">Приостанови привычки на время,</text><text x="950" y="473" class="muted">не теряя накопленный прогресс.</text><rect x="950" y="491" width="167" height="40" rx="11" fill="#f1f5ef" /><text x="970" y="516" class="label">Настроить паузу →</text><rect x="925" y="574" width="319" height="159" rx="18" fill="#fff7ed" /><text x="950" y="610" class="bold">Не получилось?</text><text x="950" y="640" class="muted">Пропуск не отменяет твой путь.</text><text x="950" y="662" class="muted">Можно спокойно начать снова.</text><rect x="950" y="680" width="195" height="36" rx="11" fill="#fff" stroke="#eadfce" /><text x="969" y="703" class="label">Разобрать пропуск →</text></svg>