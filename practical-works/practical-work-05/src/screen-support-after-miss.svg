<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><defs><style>.t{font:15px Arial,sans-serif;fill:#23352f}.muted{font:13px Arial,sans-serif;fill:#718078}.small{font:12px Arial,sans-serif;fill:#718078}.bold{font:bold 17px Arial,sans-serif;fill:#23352f}.title{font:bold 28px Arial,sans-serif;fill:#23352f}.label{font:bold 12px Arial,sans-serif;fill:#567166}.white{font:bold 14px Arial,sans-serif;fill:#fff}.btntext{font:bold 13px Arial,sans-serif;fill:#43865c}</style></defs><rect width="1280" height="820" fill="#f5f7f3" /><rect width="235" height="820" fill="#fff" /><text x="28" y="40" class="small">МЕНЮ</text><text x="47" y="84" class="t">⌂  Сегодня</text><text x="47" y="136" class="t">▤  Привычки</text><text x="47" y="186" class="t">▦  Статистика</text><rect x="16" y="208" width="203" height="44" rx="12" fill="#eaf4ec" /><text x="47" y="236" class="t" fill="#36724d">♡  Поддержка</text><line x1="24" y1="275" x2="211" y2="275" stroke="#edf0ec" /><text x="47" y="316" class="t">⚙  Настройки</text><rect x="19" y="728" width="197" height="67" rx="14" fill="#f4f6f2" /><circle cx="49" cy="761" r="17" fill="#dce9df" /><text x="77" y="758" class="bold" font-size="14">Евгений</text><text x="77" y="778" class="small">Мой профиль</text><text x="278" y="48" class="small">СЕГОДНЯ  /  ПОДДЕРЖКА</text><text x="278" y="91" class="title">Пропуск — не провал</text><text x="278" y="119" class="muted">Планы меняются. Давай спокойно выберем следующий маленький шаг.</text><rect x="278" y="151" width="966" height="116" rx="18" fill="#eaf4ec" /><text x="307" y="197" class="bold">Ты не потерял свой прогресс</text><text x="307" y="223" class="muted">Один пропуск не отменяет того, что уже получилось. Никаких штрафов — только поддержка.</text>
<rect x="278" y="289" width="615" height="293" rx="18" fill="#fff" /><text x="307" y="329" class="bold">Что помешало сегодня?</text><text x="307" y="354" class="muted">Выбери вариант — это поможет подобрать более подходящий план.</text><rect x="307" y="378" width="170" height="43" rx="12" fill="#eaf4ec" stroke="#b8d4bd" /><text x="326" y="405" class="label">⌛  Не хватило времени</text><rect x="489" y="378" width="155" height="43" rx="12" fill="#f7f8f5" /><text x="508" y="405" class="muted">Забыл(а)</text><rect x="656" y="378" width="208" height="43" rx="12" fill="#f7f8f5" /><text x="675" y="405" class="muted">Не было сил</text><rect x="307" y="433" width="170" height="43" rx="12" fill="#f7f8f5" /><text x="326" y="460" class="muted">Изменились планы</text><rect x="489" y="433" width="156" height="43" rx="12" fill="#f7f8f5" /><text x="508" y="460" class="muted">Слишком сложно</text><rect x="656" y="433" width="208" height="43" rx="12" fill="#f7f8f5" /><text x="675" y="460" class="muted">Другая причина</text><text x="307" y="515" class="muted">Можно просто выбрать причину — писать объяснение не нужно.</text><text x="307" y="552" class="label">Выбрано: не хватило времени</text>
<rect x="915" y="289" width="329" height="293" rx="18" fill="#fff" /><text x="943" y="329" class="bold">Мягкий следующий шаг</text><text x="943" y="361" class="muted">Сегодня можно засчитать</text><text x="943" y="383" class="muted">минимум вместо полной цели:</text><rect x="943" y="401" width="273" height="68" rx="13" fill="#f3f7f1" /><text x="961" y="429" class="bold">Прочитать 1 страницу</text><text x="961" y="451" class="small">около 2 минут</text><rect x="943" y="487" width="273" height="42" rx="11" fill="#43865c" /><text x="1002" y="514" class="white">Выбрать этот шаг</text><text x="1003" y="556" class="btntext">Пропустить сегодня →</text>
<rect x="278" y="606" width="966" height="113" rx="18" fill="#fff" /><circle cx="318" cy="655" r="22" fill="#f5f0e8" /><text x="309" y="662" font-size="19">✦</text><text x="354" y="644" class="bold">Хочешь понять, как адаптировать план?</text><text x="354" y="670" class="muted">Помощник предложит идеи на основе причины пропуска и твоих привычек.</text><rect x="950" y="634" width="266" height="43" rx="11" fill="#f1f5ef" /><text x="976" y="661" class="btntext">Разобрать с ИИ-помощником →</text><text x="278" y="759" class="small">Вернуться к сегодняшнему плану ←</text></svg>