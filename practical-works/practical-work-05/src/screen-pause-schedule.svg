<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><defs><style>.t{font:15px Arial,sans-serif;fill:#23352f}.muted{font:13px Arial,sans-serif;fill:#718078}.small{font:12px Arial,sans-serif;fill:#718078}.bold{font:bold 17px Arial,sans-serif;fill:#23352f}.title{font:bold 28px Arial,sans-serif;fill:#23352f}.label{font:bold 12px Arial,sans-serif;fill:#567166}.white{font:bold 14px Arial,sans-serif;fill:#fff}.btntext{font:bold 13px Arial,sans-serif;fill:#43865c}</style></defs><rect width="1280" height="820" fill="#f5f7f3" /><rect width="235" height="820" fill="#fff" /><text x="28" y="40" class="small">МЕНЮ</text><text x="47" y="84" class="t">⌂  Сегодня</text><rect x="16" y="108" width="203" height="44" rx="12" fill="#eaf4ec" /><text x="47" y="136" class="t" fill="#36724d">▤  Привычки</text><text x="47" y="186" class="t">▦  Статистика</text><text x="47" y="236" class="t">♡  Поддержка</text><line x1="24" y1="275" x2="211" y2="275" stroke="#edf0ec" /><text x="47" y="316" class="t">⚙  Настройки</text><rect x="19" y="728" width="197" height="67" rx="14" fill="#f4f6f2" /><circle cx="49" cy="761" r="17" fill="#dce9df" /><text x="77" y="758" class="bold" font-size="14">Евгений</text><text x="77" y="778" class="small">Мой профиль</text><text x="278" y="48" class="small">ПРИВЫЧКИ  /  РАСПИСАНИЕ</text><text x="278" y="91" class="title">Пауза и расписание</text><text x="278" y="119" class="muted">Подстрой привычки под свою жизнь — прогресс останется с тобой.</text>
<rect x="278" y="151" width="966" height="104" rx="18" fill="#eaf4ec" /><circle cx="322" cy="203" r="24" fill="#fff" /><text x="313" y="211" font-size="22">⏸</text><text x="365" y="192" class="bold">Нужна передышка?</text><text x="365" y="219" class="muted">Временная пауза приостановит напоминания и сохранит накопленный прогресс.</text><rect x="1048" y="181" width="166" height="42" rx="12" fill="#43865c" /><text x="1131" y="208" class="white" text-anchor="middle">Включить паузу</text>
<rect x="278" y="277" width="598" height="338" rx="18" fill="#fff" /><text x="308" y="318" class="bold">На какой срок поставить паузу?</text><text x="308" y="344" class="muted">Выбери период, после которого привычки продолжатся автоматически.</text><circle cx="322" cy="384" r="9" fill="#fff" stroke="#43865c" stroke-width="2" /><circle cx="322" cy="384" r="4" fill="#43865c" /><text x="345" y="389" class="t">До конца сегодняшнего дня</text><line x1="308" y1="408" x2="846" y2="408" stroke="#edf0ec" /><circle cx="322" cy="438" r="9" fill="#fff" stroke="#b9c6bc" stroke-width="2" /><text x="345" y="443" class="t">Выбрать даты</text><text x="345" y="466" class="small">Начало</text><rect x="345" y="477" width="219" height="42" rx="10" fill="#fff" stroke="#dce3dd" /><text x="361" y="504" class="t">9 ноября 2026  ▦</text><text x="585" y="466" class="small">Возобновить</text><rect x="585" y="477" width="242" height="42" rx="10" fill="#fff" stroke="#dce3dd" /><text x="601" y="504" class="t">10 ноября 2026  ▦</text><rect x="308" y="542" width="538" height="48" rx="12" fill="#f3f7f1" /><text x="326" y="572" class="label">✓  Серия и история выполнения сохранятся</text>
<rect x="898" y="277" width="346" height="338" rx="18" fill="#fff" /><text x="927" y="318" class="bold">Рабочие дни</text><text x="927" y="344" class="muted">Отметь дни, когда план активен.</text><g font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle"><rect x="927" y="370" width="38" height="38" rx="11" fill="#43865c" /><text x="946" y="394" fill="#fff">Пн</text><rect x="974" y="370" width="38" height="38" rx="11" fill="#43865c" /><text x="993" y="394" fill="#fff">Вт</text><rect x="1021" y="370" width="38" height="38" rx="11" fill="#43865c" /><text x="1040" y="394" fill="#fff">Ср</text><rect x="1068" y="370" width="38" height="38" rx="11" fill="#43865c" /><text x="1087" y="394" fill="#fff">Чт</text><rect x="1115" y="370" width="38" height="38" rx="11" fill="#43865c" /><text x="1134" y="394" fill="#fff">Пт</text><rect x="1162" y="370" width="38" height="38" rx="11" fill="#f1f4ef" /><text x="1181" y="394" fill="#718078">Сб</text><rect x="1209" y="370" width="27" height="38" rx="10" fill="#f1f4ef" /><text x="1222" y="394" fill="#718078">Вс</text></g><text x="927" y="443" class="muted">Настройка применяется ко всем</text><text x="927" y="464" class="muted">привычкам. Для отдельной привычки</text><text x="927" y="485" class="muted">расписание можно изменить в её карточке.</text><line x1="927" y1="505" x2="1215" y2="505" stroke="#edf0ec" /><text x="927" y="538" class="bold">Напоминания</text><text x="927" y="565" class="muted">В дни паузы отключены</text><rect x="1170" y="548" width="45" height="25" rx="13" fill="#dceede" /><circle cx="1202" cy="560" r="9" fill="#43865c" />
<rect x="278" y="642" width="966" height="92" rx="18" fill="#fff" /><text x="307" y="679" class="bold">Расписание привычек можно менять в любой момент</text><text x="307" y="706" class="muted">Выбери дни, которые действительно подходят твоему ритму.</text><rect x="1002" y="666" width="106" height="42" rx="11" fill="#f1f5ef" /><text x="1027" y="693" class="btntext">Отмена</text><rect x="1120" y="666" width="96" height="42" rx="11" fill="#43865c" /><text x="1134" y="693" class="white">Сохранить</text></svg>